<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f8f79">
  <title>缘的考研舱 | KaoYan</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="auth-screen">
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-brand">
          <span class="brand-mark">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 2s6 5 6 11a6 6 0 0 1-12 0c0-3 2-5 3-6 1 1 2 1 3 0-1-2-2-3-2-5Z"/>
            </svg>
          </span>
          <span>缘的考研舱</span>
        </div>

        <div id="auth-login-view">
          <h2>登录</h2>
          <form onsubmit="return App.login(event)">
            <input id="auth-login-email" class="input" type="email" placeholder="邮箱" required>
            <input id="auth-login-password" class="input" type="password" placeholder="密码" required>
            <div id="auth-error" class="auth-error"></div>
            <button class="btn primary" type="submit">登录</button>
          </form>
          <div class="auth-switch">还没有账号？<a onclick="App.showRegister()">注册</a></div>
        </div>

        <div id="auth-register-view" class="hidden">
          <h2>注册</h2>
          <form onsubmit="return App.register(event)">
            <input id="auth-register-email" class="input" type="email" placeholder="邮箱" required>
            <input id="auth-register-password" class="input" type="password" placeholder="密码（至少 6 位）" required>
            <input id="auth-register-secondary" class="input" type="password" inputmode="numeric" maxlength="6" placeholder="二级密码（6 位数字）" required>
            <div id="auth-register-error" class="auth-error"></div>
            <button class="btn primary" type="submit">注册</button>
          </form>
          <div class="auth-switch">已有账号？<a onclick="App.showLogin()">返回登录</a></div>
        </div>
      </div>
    </div>
  </div>

  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2s6 5 6 11a6 6 0 0 1-12 0c0-3 2-5 3-6 1 1 2 1 3 0-1-2-2-3-2-5Z"/>
          </svg>
        </span>
        <span>缘的考研舱</span>
      </div>
      <nav>
        <button class="nav-btn active" data-view="home">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>
            </svg>
          </span>
          <span>首页总览</span>
        </button>
        <button class="nav-btn" data-view="plan">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 2v4"/><path d="M16 2v4"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M8 14h8"/><path d="M8 18h5"/>
            </svg>
          </span>
          <span>今日计划</span>
        </button>
        <button class="nav-btn" data-view="tests">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 4h16v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M4 8h16"/><path d="m9 13 2 2 4-5"/>
            </svg>
          </span>
          <span>模拟测试</span>
        </button>
        <button class="nav-btn" data-view="resources">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M13 2v7h7"/>
            </svg>
          </span>
          <span>电子资料</span>
        </button>
        <button class="nav-btn" data-view="wrong">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-7 7c0 2 .8 3.6 2 5v2h10v-2c1.2-1.4 2-3 2-5a7 7 0 0 0-7-7Z"/>
            </svg>
          </span>
          <span>错题本</span>
        </button>
      </nav>
      <div class="sidebar-foot" id="sidebar-countdown"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="view-title">首页总览</h1>
          <div class="top-date" id="top-date"></div>
        </div>
        <div class="topbar-actions">
          <button class="btn ghost" id="backup-btn" title="备份">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>
            </svg>
            <span>备份</span>
          </button>
          <button class="icon-btn" id="settings-btn" title="设置">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1a1.7 1.7 0 0 0 1.9.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6h0a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.9v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="content">
        <section id="view-home" class="view active"></section>
        <section id="view-plan" class="view"></section>
        <section id="view-tests" class="view"></section>
        <section id="view-resources" class="view"></section>
        <section id="view-wrong" class="view"></section>
      </div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast"></div>
  <script src="core.js"></script>
  <script src="storage.js"></script>
  <script src="questionBank.js"></script>
  <script src="auth.js"></script>
  <script src="cloud.js"></script>
  <script src="app.js"></script>
</body>
</html>
